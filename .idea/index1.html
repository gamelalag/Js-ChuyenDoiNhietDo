<script>
    class Temperature {
        constructor(celsius) {
            if(celsius<-273.15) {
                console.error("Nhiệt độ không thể thấp hơn");
                this.cenlisus = -273.15;
            }else{
                this.celsius = celsius;

            }
        }
        getTinhNhietDoK(){
            return (this.celsius + 273.15).toFixed(2) + " K";

        getTinhNhietDoF(){

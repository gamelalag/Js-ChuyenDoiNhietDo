<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tính điểm Sinh viên - OOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { color: #0d6efd; font-weight: bold; margin-bottom: 30px; }
        .table-container { background: white; border-radius: 15px; padding: 20px; margin-top: 30px; }
        .badge-gioi { background-color: #198754; }
        .badge-kha { background-color: #ffc107; color: #000; }
        .badge-tb { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center">
        <h2 class="header-title">HỆ THỐNG QUẢN LÝ & TÍNH ĐIỂM SINH VIÊN</h2>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="mb-4">Nhập thông tin</h5>
                <form id="student-form">
                    <div class="mb-3">
                        <label class="form-label">Họ tên sinh viên</label>
                        <input type="text" id="name" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Điểm Toán</label>
                        <input type="number" id="math" class="form-control" min="0" max="10" step="0.1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Điểm Lý</label>
                        <input type="number" id="physics" class="form-control" min="0" max="10" step="0.1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Điểm Hóa</label>
                        <input type="number" id="chemistry" class="form-control" min="0" max="10" step="0.1" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Thêm & Tính điểm</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="table-container shadow-sm">
                <h5>Danh sách sinh viên</h5>
                <table class="table table-hover mt-3">
                    <thead class="table-light">
                    <tr>
                        <th>Tên</th>
                        <th>Toán</th>
                        <th>Lý</th>
                        <th>Hóa</th>
                        <th>ĐTB</th>
                        <th>Xếp loại</th>
                    </tr>
                    </thead>
                    <tbody id="student-list">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Định nghĩa Class theo tư duy OOP
    class SinhVien {
        constructor(ten, toan, ly, hoa) {
            this.ten = ten;
            this.toan = parseFloat(toan);
            this.ly = parseFloat(ly);
            this.hoa = parseFloat(hoa);
        }

        // Phương thức tính trung bình
        tinhDTB() {
            return ((this.toan + this.ly + this.hoa) / 3).toFixed(2);
        }

        // Phương thức xếp loại
        xepLoai() {
            const dtb = this.tinhDTB();
            if (dtb >= 8.0) return { label: "Giỏi", class: "badge-gioi" };
            if (dtb >= 6.5) return { label: "Khá", class: "badge-kha" };
            return { label: "Trung bình", class: "badge-tb" };
        }
    }

    // 2. Xử lý DOM Manipulation
    const form = document.getElementById('student-form');
    const studentList = document.getElementById('student-list');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Lấy giá trị từ input
        const name = document.getElementById('name').value;
        const math = document.getElementById('math').value;
        const physics = document.getElementById('physics').value;
        const chemistry = document.getElementById('chemistry').value;

        // Khởi tạo đối tượng từ Class
        const sv = new SinhVien(name, math, physics, chemistry);

        // Hiển thị lên bảng
        renderStudent(sv);

        // Reset form
        form.reset();
    });

    function renderStudent(sv) {
        const xepLoaiObj = sv.xepLoai();
        const row = document.createElement('tr');

        row.innerHTML = `
            <td><strong>${sv.ten}</strong></td>
            <td>${sv.toan}</td>
            <td>${sv.ly}</td>
            <td>${sv.hoa}</td>
            <td class="text-primary fw-bold">${sv.tinhDTB()}</td>
            <td><span class="badge ${xepLoaiObj.class}">${xepLoaiObj.label}</span></td>
        `;

        studentList.appendChild(row);
    }
</script>

</body>
</html>
